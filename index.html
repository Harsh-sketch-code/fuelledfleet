<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Fuelled — Fleet Safety Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F4F1;--bg2:#FFFFFF;--bg3:#EEECEA;--border:#E0DDD8;--border2:#C8C5BF;
  --text:#1A1A18;--text2:#6B6860;--text3:#9A9690;
  --accent:#F05A28;--accent-light:#FEF0EB;--accent-border:#F9C4AF;
  --green:#1A8C5E;--green-bg:#E8F5EF;
  --blue:#2266CC;--blue-bg:#EBF1FB;
  --amber:#9A6200;--amber-bg:#FEF5E0;
  --red:#CC2222;--red-bg:#FCEAEA;
  --radius:10px;--radius-sm:6px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --font:Inter,sans-serif;--mono:JetBrains Mono,monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}

/* NAV */
.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:110px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.nav-brand{display:flex;align-items:center;gap:22px}
.nav-logo{display:flex;align-items:center;gap:20px;font-weight:600;font-size:14px;color:var(--text2)}
.nav-logo img{height:80px;width:auto;display:block}
.nav-logo .product{font-family:var(--mono);font-size:14px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;border-left:1px solid var(--border2);padding-left:20px}
.nav-divider{width:1px;height:20px;background:var(--border2)}
.nav-sub{font-size:12px;color:var(--text3);font-family:var(--mono);letter-spacing:.02em}

/* PAGE */
.page{max-width:1280px;margin:0 auto;padding:1.5rem}

/* PERIOD BAR */
.period-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;margin-bottom:1.25rem;box-shadow:var(--shadow)}
.period-label{font-size:11px;font-weight:600;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.period-select{font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg2);color:var(--text);cursor:pointer;flex:1;min-width:180px}
.view-toggle{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px;gap:2px}
.vt-btn{font-size:12px;font-weight:500;font-family:var(--mono);padding:5px 14px;border-radius:4px;border:none;background:transparent;color:var(--text2);cursor:pointer;transition:all .12s}
.vt-btn.active{background:var(--bg2);color:var(--text);box-shadow:var(--shadow)}

/* SUMMARY */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:1.25rem}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-family:var(--mono)}
.stat-value{font-size:26px;font-weight:700;color:var(--text);line-height:1}
.stat-sub{font-size:11px;color:var(--text3);margin-top:5px;font-family:var(--mono)}
.delta-up{color:var(--green)}
.delta-down{color:var(--red)}
.delta-flat{color:var(--text3)}

/* TABS */
.tabs{display:flex;gap:1px;border-bottom:2px solid var(--border);margin-bottom:1.25rem}
.tab{font-size:13px;font-weight:500;padding:9px 16px;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .12s;background:transparent;border-left:none;border-right:none;border-top:none;font-family:var(--font)}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* DRIVER CARDS */
.driver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.driver-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:box-shadow .15s,border-color .15s;box-shadow:var(--shadow)}
.driver-card:hover{box-shadow:var(--shadow-md);border-color:var(--border2)}
.driver-card.top-card{border-color:var(--accent);border-width:1.5px}
.driver-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;font-family:var(--mono)}
.driver-info{flex:1;min-width:0}
.driver-name{font-size:15px;font-weight:600;color:var(--text)}
.driver-truck{font-size:11px;color:var(--text3);margin-top:2px;font-family:var(--mono)}
.score-ring-wrap{position:relative;width:54px;height:54px;flex-shrink:0}
.score-ring-wrap svg{width:54px;height:54px;transform:rotate(-90deg)}
.score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--mono)}

.metrics-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.metric-box{background:var(--bg3);border-radius:var(--radius-sm);padding:8px 10px;border:1px solid var(--border)}
.metric-label{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;font-family:var(--mono)}
.metric-val{font-size:14px;font-weight:700;color:var(--text)}
.metric-val.warn{color:var(--amber)}
.metric-val.bad{color:var(--red)}

.trend-section{margin-bottom:12px}
.trend-label{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-family:var(--mono)}
.trend-bars{display:flex;align-items:flex-end;gap:3px;height:32px}
.trend-col{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.trend-bar-el{border-radius:2px 2px 0 0;width:100%;min-height:2px}
.trend-wk{font-size:8px;color:var(--text3);font-family:var(--mono)}

.card-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:11px;gap:6px;flex-wrap:wrap}
.rank-txt{font-size:11px;color:var(--text3);font-family:var(--mono)}
.status-pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;font-family:var(--mono)}
.s-excellent{background:#DCFCE7;color:#166534}
.s-good{background:#DBEAFE;color:#1D4ED8}
.s-fair{background:#FEF9C3;color:#854D0E}
.s-risk{background:#FEE2E2;color:#991B1B}
.s-empty{background:var(--bg3);color:var(--text3)}
.top-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--accent-light);color:var(--accent);border:1px solid var(--accent-border);font-family:var(--mono)}
.star-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--amber-bg);color:var(--amber);border:1px solid #E8C84A;font-family:var(--mono);display:inline-flex;align-items:center;gap:3px}
.no-data-text{font-size:12px;color:var(--text3);font-style:italic;text-align:center;padding:14px;font-family:var(--mono)}

/* LEADERBOARD */
.lb-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.lb-header-row{display:grid;grid-template-columns:44px 46px 1fr 100px 70px 70px;gap:10px;padding:9px 18px;background:var(--bg3);border-bottom:1px solid var(--border);align-items:center}
.lb-data-row{display:grid;grid-template-columns:44px 46px 1fr 100px 70px 70px;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border);align-items:center;transition:background .1s}
.lb-data-row:last-child{border-bottom:none}
.lb-data-row:hover{background:var(--bg3)}
.lb-hcell{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
.lb-rank{font-size:14px;font-weight:700;text-align:center;font-family:var(--mono)}
.lb-name{font-size:14px;font-weight:600;color:var(--text)}
.lb-sub{font-size:10px;color:var(--text3);font-family:var(--mono)}
.lb-bar-bg{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.lb-bar-fill{height:100%;border-radius:3px}
.lb-score{font-size:16px;font-weight:700;text-align:right;font-family:var(--mono)}
.lb-trend{font-size:11px;text-align:center;font-family:var(--mono)}

/* FEEDBACK */
.feedback-layout{display:grid;grid-template-columns:220px 1fr;gap:12px}
.fb-sidebar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.fb-sidebar-item{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.fb-sidebar-item:last-child{border-bottom:none}
.fb-sidebar-item:hover{background:var(--bg3)}
.fb-sidebar-item.active{background:var(--accent-light);border-left:3px solid var(--accent)}
.fb-sidebar-name{font-size:13px;font-weight:600;color:var(--text)}
.fb-sidebar-count{font-size:10px;color:var(--text3);font-family:var(--mono);margin-left:auto}
.fb-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-height:400px}
.fb-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.fb-panel-title{font-size:15px;font-weight:700}
.fb-item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:9px;background:var(--bg3)}
.fb-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.fb-cat{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:20px;font-family:var(--mono)}
.fb-cat.positive{background:#DCFCE7;color:#166534}
.fb-cat.coaching{background:#FEF9C3;color:#854D0E}
.fb-cat.warning{background:#FEE2E2;color:#991B1B}
.fb-cat.general{background:#F3F4F6;color:#374151}
.fb-date{font-size:10px;color:var(--text3);font-family:var(--mono)}
.fb-note{font-size:13px;color:var(--text2);line-height:1.55}
.empty-fb{text-align:center;padding:2rem;color:var(--text3);font-size:13px}

.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;gap:14px}
.spinner{width:28px;height:28px;border:2.5px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:12px;color:var(--text3);font-family:var(--mono)}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-brand">
    <div class="nav-logo">
      <img src="fuelled-logo.png" alt="Fuelled"/>
      <span class="product">Fleet Safety</span>
    </div>
    <div class="nav-divider"></div>
    <div class="nav-sub" id="navSub">Loading…</div>
  </div>
</div>

<div class="page" id="loadingScreen">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-txt">Loading fleet data…</div>
  </div>
</div>

<div class="page" id="app" style="display:none">

  <div class="period-bar">

      <button class="vt-btn active" id="vt-weekly"  onclick="setView('weekly')">Weekly</button>
      <button class="vt-btn"        id="vt-monthly" onclick="setView('monthly')">Monthly</button>
    </div>
    <span class="period-label" id="periodLabel">Week</span>
    <select class="period-select" id="weekPicker"></select>
  </div>

  <div class="summary-grid" id="summaryGrid"></div>

  <div class="tabs">
    <button class="tab active" data-tab="cards">Driver Cards</button>
    <button class="tab" data-tab="leaderboard">Leaderboard</button>
    <button class="tab" data-tab="feedback">Feedback</button>
  </div>

  <div class="tab-panel active" id="tab-cards">
    <div class="driver-grid" id="driverGrid"></div>
  </div>

  <div class="tab-panel" id="tab-leaderboard">
    <div class="lb-wrap" id="leaderboard"></div>
  </div>

  <div class="tab-panel" id="tab-feedback">
    <div class="feedback-layout">
      <div class="fb-sidebar" id="fbSidebar"></div>
      <div class="fb-panel" id="fbPanel"></div>
    </div>
  </div>

</div>

const ROSTER = DATA.roster;
const weeks  = DATA.weeks.slice().sort((a,b) => a.start_iso.localeCompare(b.start_iso));
const months = (DATA.months || []).slice().sort((a,b) => a.start_iso.localeCompare(b.start_iso));

// 6 metric boxes per card. Distracted is not provided per-driver; using Traffic Lights instead.
const METRICS = [
  {key:'sign_violations', label:'Rolling Stop'},
  {key:'following_close', label:'Following Close'},
  {key:'hard_accel',      label:'Hard Accel'},
  {key:'hard_brake',      label:'Hard Brake'},
  {key:'speeding',        label:'Speeding'},
  {key:'traffic_lights',  label:'Traffic Lights'},
];

const AV = [
  {bg:'#DBEAFE',tx:'#1D4ED8'},{bg:'#DCFCE7',tx:'#166534'},
  {bg:'#FEE2E2',tx:'#991B1B'},{bg:'#EDE9FE',tx:'#5B21B6'},
  {bg:'#FEF9C3',tx:'#854D0E'},{bg:'#FCE7F3',tx:'#9D174D'},
];

let view = 'weekly';            // 'weekly' or 'monthly'
let selPeriodIso = null;        // start_iso of selected week or month
let selFbDriver = null;

function currentList(){ return view === 'weekly' ? weeks : months; }
function currentItem(){ return currentList().find(p => p.start_iso === selPeriodIso); }

function ini(n){return n.split(' ').map(p=>p[0]).join('').toUpperCase().slice(0,2);}
// Returns the driver name effective for a given period start date.
// Falls back to roster.name if no history is defined.
function nameAt(rosterEntry, periodIso){
  if(!rosterEntry.name_history || !rosterEntry.name_history.length) return rosterEntry.name;
  const iso = periodIso || '9999-12-31';
  let pick = rosterEntry.name_history[0].name;
  for(const e of rosterEntry.name_history){
    if(e.from_iso <= iso) pick = e.name;
    else break;
  }
  return pick;
}
function shortDate(iso){const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function tier(s){
  if(s == null) return ['s-empty','No data'];
  if(s >= 950) return ['s-excellent','Excellent'];
  if(s >= 900) return ['s-good','Good'];
  if(s >= 850) return ['s-fair','Fair'];
  return ['s-risk','At risk'];
}
function ringColor(s){
  if(s == null) return '#9A9690';
  if(s >= 950) return '#1A8C5E';
  if(s >= 900) return '#2266CC';
  if(s >= 850) return '#9A6200';
  return '#CC2222';
}
function metricCls(v){
  if(v >= 5) return 'bad';
  if(v >= 2) return 'warn';
  return '';
}
function fmtDelta(d, isNew){
  if(isNew) return `<span class="delta-up">↑ new</span>`;
  if(d == null) return `<span class="delta-flat">—</span>`;
  if(d === 0)  return `<span class="delta-flat">— no change</span>`;
  if(d > 0)    return `<span class="delta-up">↑ ${d}</span>`;
  return `<span class="delta-down">↓ ${Math.abs(d)}</span>`;
}

// ===== INIT =====
function rebuildPicker(){
  const picker = document.getElementById('weekPicker');
  picker.innerHTML = '';
  const list = currentList();
  if(list.length === 0){
    const opt = document.createElement('option');
    opt.textContent = view === 'monthly' ? 'No monthly reports yet' : 'No weekly reports yet';
    opt.disabled = true;
    picker.appendChild(opt);
    return;
  }
  list.slice().reverse().forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.start_iso;
    opt.textContent = view === 'weekly'
      ? `${shortDate(p.start_iso)} – ${shortDate(p.end_iso)}, ${p.start_iso.slice(0,4)}`
      : p.label;
    picker.appendChild(opt);
  });
  // Default selection: most recent
  selPeriodIso = list[list.length-1].start_iso;
  picker.value = selPeriodIso;
}

function setView(v){
  view = v;
  document.getElementById('vt-weekly').classList.toggle('active',  v === 'weekly');
  document.getElementById('vt-monthly').classList.toggle('active', v === 'monthly');
  document.getElementById('periodLabel').textContent = v === 'weekly' ? 'Week' : 'Month';
  rebuildPicker();
  render();
}

function init(){
  const picker = document.getElementById('weekPicker');
  picker.addEventListener('change', () => { selPeriodIso = picker.value; render(); });

  rebuildPicker();

  document.getElementById('navSub').textContent = weeks.length
    ? `${shortDate(weeks[0].start_iso)} → ${shortDate(weeks[weeks.length-1].end_iso)}, ${weeks[0].start_iso.slice(0,4)} · ${weeks.length} weeks · ${months.length} month${months.length === 1 ? '' : 's'}`
    : 'No data loaded';

  // Tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('tab-'+t.dataset.tab).classList.add('active');
    });
  });

  // Default feedback driver = first roster member
  selFbDriver = ROSTER[0].id;

  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  render();
}

// Last N periods history for a driver (for trend bars)
function history(driverId, n){
  return currentList().slice(-n).map(p => {
    const d = p.drivers[driverId];
    return {
      iso: p.start_iso,
      label: view === 'weekly' ? shortDate(p.start_iso) : p.label.split(' ')[0].slice(0,3),
      score: d ? d.score : null,
    };
  });
}

// ===== RENDER =====
function render(){
  const w = currentItem();
  if(!w){
    document.getElementById('summaryGrid').innerHTML = '<div class="stat-card"><div class="stat-label">No data</div><div class="stat-value">—</div><div class="stat-sub">No ' + view + ' report selected</div></div>';
    document.getElementById('driverGrid').innerHTML = '';
    document.getElementById('leaderboard').innerHTML = '';
    return;
  }

  // Summary
  const fa = w.fleet_average_score;
  const totalStars = ROSTER.reduce((a,r) => a + ((w.drivers[r.id]||{}).stars || 0), 0);
  const totalInfractions = ROSTER.reduce((a,r) => {
    const d = w.drivers[r.id];
    if(!d) return a;
    return a + Object.values(d.infractions||{}).reduce((b,v)=>b+v, 0);
  }, 0);
  const driversWithScore = ROSTER.filter(r => w.drivers[r.id] && w.drivers[r.id].score != null).length;

  const periodWord = view === 'monthly' ? 'month' : 'week';
  const fleetSub = !fa ? '—' :
    fa.delta == null ? `Aggregated from weekly data` :
    fa.delta > 0 ? `<span class="delta-up">↑ ${fa.delta}</span> vs prior ${periodWord}` :
    fa.delta < 0 ? `<span class="delta-down">↓ ${Math.abs(fa.delta)}</span> vs prior ${periodWord}` :
    `No change vs prior ${periodWord}`;
  const provisional = view === 'monthly' && w.is_provisional
    ? '<span style="margin-left:8px;font-size:10px;font-family:var(--mono);background:var(--amber-bg);color:var(--amber);border:1px solid #E8C84A;border-radius:20px;padding:2px 8px;">IN PROGRESS</span>'
    : '';

  document.getElementById('summaryGrid').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Fleet Average ${provisional}</div>
      <div class="stat-value">${fa? fa.score : '—'}</div>
      <div class="stat-sub">${fleetSub}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Drivers Scored</div>
      <div class="stat-value">${driversWithScore}</div>
      <div class="stat-sub">of ${ROSTER.length} on roster</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Driver Stars</div>
      <div class="stat-value">${totalStars}</div>
      <div class="stat-sub">${totalStars ? 'Positive driving recognition' : 'None awarded this week'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Infractions</div>
      <div class="stat-value">${totalInfractions}</div>
      <div class="stat-sub">All drivers · all categories</div>
    </div>
  `;

  renderCards(w);
  renderLeaderboard(w);
  renderFeedback();
}

function renderCards(w){
  // Order: drivers with score (descending), then no-data
  const ordered = ROSTER.slice().sort((a,b) => {
    const sa = (w.drivers[a.id] && w.drivers[a.id].score) ?? -1;
    const sb = (w.drivers[b.id] && w.drivers[b.id].score) ?? -1;
    return sb - sa;
  });
  const topId = ordered.find(r => w.drivers[r.id] && w.drivers[r.id].score != null)?.id;

  document.getElementById('driverGrid').innerHTML = ordered.map((r, idx) => {
    const av = AV[idx % AV.length];
    const d = w.drivers[r.id];
    const displayName = nameAt(r, selPeriodIso);
    if(!d || d.score == null){
      return `
        <div class="driver-card">
          <div class="driver-top">
            <div class="avatar" style="background:var(--bg3);color:var(--text3)">${ini(displayName)}</div>
            <div class="driver-info">
              <div class="driver-name">${displayName}</div>
              <div class="driver-truck">${r.truck}</div>
            </div>
            <div class="score-ring-wrap">
              <svg viewBox="0 0 54 54">
                <circle cx="27" cy="27" r="22" fill="none" stroke="var(--bg3)" stroke-width="5"/>
              </svg>
              <div class="score-num" style="color:var(--text3)">—</div>
            </div>
          </div>
          <div class="no-data-text">No data this week</div>
        </div>
      `;
    }

    const [cls, label] = tier(d.score);
    const rc = ringColor(d.score);
    const pct = Math.max(0, Math.min(1, d.score / 1000));
    const C = 2 * Math.PI * 22;
    const isNew = d.score === d.delta;

    const metricsHTML = METRICS.map(m => {
      const v = (d.infractions && d.infractions[m.key]) || 0;
      return `
        <div class="metric-box">
          <div class="metric-label">${m.label}</div>
          <div class="metric-val ${metricCls(v)}">${v}</div>
        </div>
      `;
    }).join('');

    // Trend bars (last 5 weeks for this driver)
    const hist = history(r.id, 5);
    const trendHTML = hist.map(h => {
      const s = h.score;
      const max = 1100;
      const minScore = 600;
      const pctH = s == null ? 0 : Math.max(8, Math.min(100, ((s-minScore)/(max-minScore))*100));
      const c = s == null ? 'var(--bg3)' : ringColor(s);
      return `
        <div class="trend-col">
          <div class="trend-bar-el" style="height:${pctH}%;background:${c}"></div>
          <div class="trend-wk">${h.label.replace(' ',' ')}</div>
        </div>
      `;
    }).join('');

    const isTop = r.id === topId;
    const stars = d.stars || 0;
    const starsBadge = stars > 0
      ? `<span class="star-badge">★ ${stars}</span>` : '';

    return `
      <div class="driver-card ${isTop ? 'top-card' : ''}">
        <div class="driver-top">
          <div class="avatar" style="background:${av.bg};color:${av.tx}">${ini(displayName)}</div>
          <div class="driver-info">
            <div class="driver-name">${displayName}</div>
            <div class="driver-truck">${r.truck}</div>
          </div>
          <div class="score-ring-wrap">
            <svg viewBox="0 0 54 54">
              <circle cx="27" cy="27" r="22" fill="none" stroke="var(--bg3)" stroke-width="5"/>
              <circle cx="27" cy="27" r="22" fill="none" stroke="${rc}" stroke-width="5"
                stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" stroke-linecap="round"/>
            </svg>
            <div class="score-num" style="color:${rc}">${d.score}</div>
          </div>
        </div>

        <div class="metrics-grid">${metricsHTML}</div>

        <div class="trend-section">
          <div class="trend-label">Score · last 5 weeks</div>
          <div class="trend-bars">${trendHTML}</div>
        </div>

        <div class="card-footer">
          <span class="rank-txt">${fmtDelta(d.delta, isNew)}</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${starsBadge}
            ${isTop ? '<span class="top-badge">★ TOP</span>' : ''}
            <span class="status-pill ${cls}">${label}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderLeaderboard(w){
  const ranked = ROSTER
    .map(r => ({...r, ...(w.drivers[r.id] || {})}))
    .filter(r => r.score != null)
    .sort((a,b) => b.score - a.score);

  const noData = ROSTER.filter(r => !w.drivers[r.id] || w.drivers[r.id].score == null);

  const headerHTML = `
    <div class="lb-header-row">
      <div class="lb-hcell">Rank</div>
      <div></div>
      <div class="lb-hcell">Driver</div>
      <div class="lb-hcell">Score Bar</div>
      <div class="lb-hcell" style="text-align:right">Score</div>
      <div class="lb-hcell" style="text-align:center">Δ</div>
    </div>
  `;
  const rowsHTML = ranked.map((r, i) => {
    const av = AV[ROSTER.findIndex(x => x.id === r.id) % AV.length];
    const fillColor = ringColor(r.score);
    const widthPct = Math.max(5, Math.min(100, ((r.score - 600) / 500) * 100));
    const isNew = r.score === r.delta;
    const lbDisplayName = nameAt(r, selPeriodIso);
    return `
      <div class="lb-data-row">
        <div class="lb-rank">#${i+1}</div>
        <div class="avatar" style="background:${av.bg};color:${av.tx};width:32px;height:32px;font-size:11px">${ini(lbDisplayName)}</div>
        <div>
          <div class="lb-name">${lbDisplayName}</div>
          <div class="lb-sub">${r.truck}</div>
        </div>
        <div class="lb-bar-bg"><div class="lb-bar-fill" style="width:${widthPct}%;background:${fillColor}"></div></div>
        <div class="lb-score" style="color:${fillColor}">${r.score}</div>
        <div class="lb-trend">${fmtDelta(r.delta, isNew)}</div>
      </div>
    `;
  }).join('');

  const noDataHTML = noData.length === 0 ? '' : `
    <div style="padding:10px 18px;border-top:1px solid var(--border);background:var(--bg3)">
      <div class="lb-hcell" style="margin-bottom:4px">No data this week</div>
      <div style="font-size:12px;color:var(--text3);font-family:var(--mono)">${noData.map(r => nameAt(r, selPeriodIso)).join(' · ')}</div>
    </div>
  `;

  document.getElementById('leaderboard').innerHTML = headerHTML + rowsHTML + noDataHTML;
}

function renderFeedback(){
  const sb = document.getElementById('fbSidebar');
  sb.innerHTML = ROSTER.map(r => {
    const count = (FEEDBACK[r.id] || []).length;
    const fbName = nameAt(r, null);  // current name for this slot
    return `
      <div class="fb-sidebar-item ${r.id === selFbDriver ? 'active' : ''}" onclick="setFbDriver('${r.id}')">
        <div class="avatar" style="background:${AV[ROSTER.findIndex(x=>x.id===r.id) % AV.length].bg};color:${AV[ROSTER.findIndex(x=>x.id===r.id) % AV.length].tx};width:30px;height:30px;font-size:11px">${ini(fbName)}</div>
        <div class="fb-sidebar-name">${fbName}</div>
        <div class="fb-sidebar-count">${count}</div>
      </div>
    `;
  }).join('');

  const driver = ROSTER.find(r => r.id === selFbDriver);
  const driverDisplayName = nameAt(driver, null);
  // Build a small history line if this slot has had multiple drivers
  const histNames = driver.name_history
    ? driver.name_history.map(h => h.name).filter((v,i,a) => a.indexOf(v) === i)
    : [];
  const histLine = histNames.length > 1
    ? `<div class="lb-sub" style="margin-top:2px;font-style:italic">Slot history: ${histNames.join(' → ')}</div>`
    : '';
  const items = (FEEDBACK[selFbDriver] || []).slice().sort((a,b) => b.date.localeCompare(a.date));
  const panel = document.getElementById('fbPanel');
  panel.innerHTML = `
    <div class="fb-panel-header">
      <div>
        <div class="fb-panel-title">${driverDisplayName}</div>
        <div class="lb-sub" style="margin-top:4px">${driver.truck}</div>
        ${histLine}
      </div>
      <div class="lb-sub">${items.length} note${items.length === 1 ? '' : 's'}</div>
    </div>
    ${items.length === 0
      ? '<div class="empty-fb">No feedback notes yet for ' + driverDisplayName + '.</div>'
      : items.map(it => `
        <div class="fb-item">
          <div class="fb-item-top">
            <span class="fb-cat ${it.category}">${it.category}</span>
            <span class="fb-date">${it.date}</span>
          </div>
          <div class="fb-note">${escapeHtml(it.note)}</div>
        </div>
      `).join('')
    }
  `;
}

function setFbDriver(id){ selFbDriver = id; renderFeedback(); }

function escapeHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

init();
</script>

</body>
</html>
